name: Actualizar Métricas Locales

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: pip install requests

      - name: Generar archivo de métricas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generar_metricas.py

      - name: Reemplazar archivo y pushear
        run: |
          mv metricas_generadas.md metricas.md 
          
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add metricas.md
          # El cambio está en la línea de abajo, agregando [skip ci] al final del mensaje
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Actualización automática de métricas locales [skip ci]"
          git push
